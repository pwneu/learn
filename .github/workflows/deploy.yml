name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  generate-pdf:
    name: Generate and Commit PDF
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install docs-to-pdf and fs-extra
        run: npm install -g docs-to-pdf fs-extra

      - name: Prepare PDF Branch
        run: |
          git fetch origin
          git checkout pdf || git checkout -b pdf
          git reset --hard origin/pdf || true
          rm -f pwneu-docs.pdf

      - name: Generate PWNEU PDF
        run: |
          npx docs-to-pdf \
            --initialDocURLs="https://pwneu.github.io/learn/modules/introduction,https://pwneu.github.io/learn/toolkit/introduction,https://pwneu.github.io/learn/article/introduction,https://pwneu.github.io/learn/ra-cybercrime/category" \
            --contentSelector="article" \
            --paginationSelector="a.pagination-nav__link.pagination-nav__link--next" \
            --excludeSelectors=".margin-vert--xl a,[class^='tocCollapsible'],.breadcrumbs,.theme-edit-this-page" \
            --coverImage="https://pwneu.github.io/learn/img/PWNEU_LightGreenLogo.svg" \
            --outputPDFFilename="pwneu-docs.pdf"

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pwneu-docs.pdf
          git commit -m "Update PDF via GitHub Actions" || echo "Nothing to commit"
          git push --force origin pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
